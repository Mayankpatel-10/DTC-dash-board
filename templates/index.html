<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTC Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/leaflet.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <h2>DTC Dashboard</h2>
            <ul>
                <li><button onclick="window.location.href='/routes'" title="View all bus routes and schedules">Routes</button></li>
                <li><button onclick="window.location.href='/schedules'" title="Check bus timings and status">Schedules</button></li>
                <li><button onclick="window.location.href='/live-tracking'" title="Track buses in real-time">Live Tracking</button></li>
                <li><button onclick="window.location.href='/reports'" title="View analytics and reports">Reports</button></li>
            </ul>
        </div>
        <div class="main-content">
            <h1>Bus Tracking Overview</h1>
            <div id="map"></div>
            <div class="stats">
                <div class="stat-box">
                    <h2>Active Buses</h2>
                    <p id="activeBuses">Loading...</p>
                </div>
                <div class="stat-box">
                    <h2>Alerts</h2>
                    <p id="alerts">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
